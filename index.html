<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume</title>
    <link rel="stylesheet" href="style.css">
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>
    <div class="card">
        <div class="image">
            <picture>
                <source media="(min-width: 1440px)" srcset="image-product-desktop.jpg">
                <img src="image-product-mobile.jpg" alt="product image">
            </picture>
        </div>
        <div class="content">
            <p>Perfume</p>
            <h2>Gabrielle Essence Eau De Parfum</h2>
            <p>
             A floral, solar and voluptuous interpretation composed by Olivier Polge,
             Perfumer-Creator for the House of CHANEL.
            </p>


            <div class="price">
             <span class="current">$149.99 </span>
             <span class="old"> $169.99 </span>
            </div>

            <br>            
            <button> <i class="fa-solid fa-cart-shopping" style="color: rgb(255, 255, 255);"></i>   Add to Cart</button>
        </div>

    </div>

</body>

</html>
